[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --- URL variants: one canonical form (https + apex + no trailing slash) ------
# Audit P0-6. These were already returning 301 at the CDN level; declared here so
# the behaviour is versioned in the repo and cannot silently regress.
[[redirects]]
  from = "http://abogada-karina-oaxaca.com/*"
  to = "https://abogada-karina-oaxaca.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.abogada-karina-oaxaca.com/*"
  to = "https://abogada-karina-oaxaca.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.abogada-karina-oaxaca.com/*"
  to = "https://abogada-karina-oaxaca.com/:splat"
  status = 301
  force = true

# Any path except `/` served with a trailing slash → same path without it.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# --- Retired / wrong-language URLs -------------------------------------------
# Slug-level 301s live in `public/_redirects`, generated from
# `shared/retired-urls.json` by scripts/generate-redirects.mjs (single source of
# truth, also used by Nuxt routeRules for dev/preview). Do not duplicate them here.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"